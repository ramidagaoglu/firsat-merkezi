<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fırsat & Hesap Merkezi</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 360px;
            width: 100%;
        }
        h2 { margin-top: 0; color: #ffca28; }
        p { color: #b0bec5; font-size: 14px; }
        button {
            background-color: #00e676;
            color: #000;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 16px;
        }
        button:active { background-color: #00c853; }
        #status { margin: 15px 0; font-size: 13px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚡ Fırsat & Hesap Merkezi</h2>
        <p>Anlık indirimler ve pratik araçlar tek yerde.</p>
        <div id="status">Bildirim durumu kontrol ediliyor...</div>
        <button id="testBtn">Test Bildirimi Gönder</button>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const testBtn = document.getElementById('testBtn');

        // 1. Service Worker Kaydı (Kritik!)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW Kayıt Başarılı:', reg.scope))
                    .catch(err => console.log('SW Kayıt Hatası:', err));
            });
        }

        // 2. Bildirim İzin Durumunu Güncelle
        if (!("Notification" in window)) {
            statusEl.innerText = "Bu tarayıcı bildirimleri desteklemiyor.";
            statusEl.style.color = "#ff5252";
            testBtn.style.display = "none";
        } else {
            updateStatus(Notification.permission);
        }

        function updateStatus(permission) {
            if (permission === "granted") {
                statusEl.innerText = "Bildirim izni aktif! 🟢";
                statusEl.style.color = "#00e676";
            } else if (permission === "denied") {
                statusEl.innerText = "Bildirim izni engellenmiş. Ayarlardan açmalısın. 🔴";
                statusEl.style.color = "#ff5252";
            } else {
                statusEl.innerText = "Bildirim izni bekleniyor.";
                statusEl.style.color = "#ff9800";
            }
        }

        // 3. Buton Tıklama Olayı
        testBtn.addEventListener('click', async () => {
            if (Notification.permission === "granted") {
                sendNotification();
            } else {
                const permission = await Notification.requestPermission();
                updateStatus(permission);
                if (permission === "granted") {
                    sendNotification();
                } else {
                    alert("Bildirim izni verilmedi!");
                }
            }
        });

        async function sendNotification() {
            try {
                if ('serviceWorker' in navigator) {
                    const registration = await navigator.serviceWorker.ready;
                    await registration.showNotification("Fırsat & Hesap Merkezi", {
                        body: "Test bildirimi başarıyla gönderildi! 🚀",
                        icon: "https://via.placeholder.com/128",
                        badge: "https://via.placeholder.com/128",
                        vibrate: [200, 100, 200]
                    });
                } else {
                    new Notification("Fırsat & Hesap Merkezi", {
                        body: "Test bildirimi başarıyla gönderildi! 🚀"
                    });
                }
            } catch (err) {
                alert("Bildirim gönderilemedi: " + err.message);
            }
        }
    </script>
</body>
</html>
